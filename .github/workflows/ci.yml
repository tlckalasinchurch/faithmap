name: CI

# No secrets are used. The database is a throwaway PostgreSQL container with a test-only password.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faithmap_test
          POSTGRES_PASSWORD: ci-throwaway-test-only
          POSTGRES_DB: faithmap_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faithmap_test -d faithmap_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The real-PostgreSQL tests run only when this name contains "faithmap_test".
      FAITHMAP_TEST_DATABASE_URL: postgresql://faithmap_test:ci-throwaway-test-only@localhost:5432/faithmap_test_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Tests (PGlite and real PostgreSQL 16)
        run: npm test
      - name: Build
        run: npm run build
